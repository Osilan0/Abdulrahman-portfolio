<html lang="en">
<head>
<meta charset="utf-8">

<link rel="canonical" href="https://abdulrahmanosilan.com/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23111'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='28' text-anchor='middle' fill='%23fff'%3EAO%3C/text%3E%3C/svg%3E">
<meta property="og:type" content="website">
<meta property="og:url" content="https://abdulrahmanosilan.com/">
<meta property="og:title" content="Abdulrahman Osilan · Portfolio">

<meta property="og:image" content="https://abdulrahmanosilan.com/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')==='dark'?'dark':'light'}catch(e){document.documentElement.dataset.theme='light'}</script>
<link rel="preload" as="image" href="photo-sm.jpg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app" id="app">
  <aside class="side" id="side" aria-label="Navigation">
    <button class="brand" type="button" data-go="overview"><span class="brand-ava" id="sAva"><img class="ava" src="photo-sm.jpg" alt=""></span><span class="brand-t"><b id="sName">Abdulrahman Osilan</b><span id="sHead">Co-Founder &amp; CEO, Wathiq AI</span></span></button>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="side-foot">
      <button class="btn primary meet" type="button" data-go="contact">Request a meeting</button>
      <div class="side-row">
        <span class="status" id="status" role="status"><i></i><span>Connecting…</span></span>
        <button class="icon-btn" type="button" data-palette aria-label="Search the portfolio" title="Search (Ctrl or ⌘ + K)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z M20 20l-4-4"/></svg></button>
        <button class="icon-btn" type="button" id="themeBtn" aria-label="Switch to night mode" title="Switch to night mode"></button>
      </div>
    </div>
  </aside>

  <div class="main home" id="main">
    <header class="topbar">
      <button class="icon-btn" type="button" id="menuBtn" aria-label="Open navigation" aria-expanded="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <button class="top-brand" type="button" data-go="assistant"><span class="brand-ava" id="tAva"><img class="ava" src="photo-sm.jpg" alt=""></span><b id="tName">Abdulrahman Osilan</b></button>
      <span class="sp"></span>
      <button class="btn primary meet" type="button" data-go="contact">Request a meeting</button>
    </header>

    <div class="scroll" id="scroll">
      <section class="view" id="v-assistant" aria-labelledby="wTitle">
        <div class="welcome" id="welcome">
          <span class="hero-ava" id="wAva"><img class="ava" src="photo-sm.jpg" alt=""></span>
          <h1 id="wTitle">Hi, I'm Abdulrahman.</h1>
          <p class="sub" id="wSub"><span>Co-Founder &amp; CEO, Wathiq AI</span><span>Computational Data Science, Penn State</span></p>
        </div>
        <div class="thread" id="thread" aria-live="polite"></div>
      </section>
      <section class="view" id="v-overview" hidden></section>
      <section class="view" id="v-timeline" hidden></section>
      <section class="view" id="v-resume" hidden></section>
      <section class="view" id="v-startups" hidden></section>
      <section class="view" id="v-projects" hidden></section>
      <section class="view" id="v-experience" hidden></section>
      <section class="view" id="v-campus" hidden></section>
      <section class="view" id="v-certifications" hidden></section>
      <section class="view" id="v-contact" hidden></section>
    </div>

    <div class="dock" id="dock">
      <div class="dock-in">
        <div class="slash" id="slash" role="listbox" aria-label="Commands" hidden></div>
        <form id="form">
          <label class="sr" for="q">Ask a question</label>
          <textarea id="q" rows="1" maxlength="1000" placeholder="Ask about my work"></textarea>
          <button class="send" id="send" type="submit" aria-label="Send question" disabled><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
        </form>
        <div class="prompts" id="prompts"><button class="prompt" type="button" data-ask="What is Wathiq AI?">What is Wathiq AI?</button><button class="prompt" type="button" data-ask="What did you work on at PwC?">What did you work on at PwC?</button><button class="prompt" type="button" data-ask="Why do you build AI products?">Why do you build AI products?</button></div>
        <p class="fine"><span id="fine">An AI answers from this portfolio only and shows its sources.</span><button class="link" type="button" id="newChat" hidden>New chat</button></p>
      </div>
    </div>

    <figure class="sph" id="sph">
      <div class="sphere" id="sphere"></div>
      <figcaption class="sph-cap" id="sphCap">Drag to rotate · click a dot to open</figcaption>
    </figure>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Entry details" aria-hidden="true">
  <header><p class="label" id="dKind">Entry</p><button class="icon-btn" type="button" id="dClose" aria-label="Close details"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
  <div class="body" id="dBody"></div>
  <footer id="dFoot"></footer>
</aside>
<div class="toast" id="toast" role="status"></div>

<script src="core.js"></script>
<script src="app.js"></script>
<script src="palette.js"></script>
<script src="sphere.js"></script>
<script src="chat.js"></script>
</body>
</html>
